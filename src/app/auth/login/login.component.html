<div class="auth-box border-0 m-0 p-0">
  <h2 class="h4 fw-bold text-center mb-4">Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input
        type="email"
        class="form-control"
        formControlName="email">
      <div class="text-danger small mt-1" *ngIf="controls['email'].invalid && (controls['email'].dirty || controls['email'].touched)">
        <div *ngIf="controls['email'].errors?.['required']">Email is required.</div>
        <div *ngIf="controls['email'].errors?.['email']">Enter a valid email address.</div>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input
        type="password"
        class="form-control"
        formControlName="password">
      <div class="text-danger small mt-1" *ngIf="controls['password'].invalid && (controls['password'].dirty || controls['password'].touched)">
        <div *ngIf="controls['password'].errors?.['required']">Password is required.</div>
        <div *ngIf="controls['password'].errors?.['minlength']">Password must be at least 4 characters.</div>
      </div>
    </div>
    <div class="alert alert-danger py-2" *ngIf="error">{{error}}</div>
    <button class="btn btn-primary w-100 fw-semibold" type="submit" [disabled]="loginForm.invalid">Login</button>
  </form>
  <div class="text-center mt-3 small">
    <span>Don't have an account?</span>
    <a class="fw-semibold text-decoration-none ms-1" routerLink="/register">Register</a>
  </div>
</div>
