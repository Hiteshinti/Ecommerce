<div>
  <h2>Login</h2>
  <form (ngSubmit)="submit(loginForm)" #loginForm="ngForm" novalidate>
    <div>
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" required email #emailInput="ngModel">
      <div *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)">
        <small *ngIf="emailInput.errors?.['required']">Email is required.</small>
        <small *ngIf="emailInput.errors?.['email']">Enter a valid email address.</small>
      </div>
    </div>
    <div>
      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" required minlength="4" #passwordInput="ngModel">
      <div *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)">
        <small *ngIf="passwordInput.errors?.['required']">Password is required.</small>
        <small *ngIf="passwordInput.errors?.['minlength']">Password must be at least 4 characters.</small>
      </div>
    </div>
    <div *ngIf="error">{{error}}</div>
    <button type="submit" [disabled]="loginForm.invalid">Login</button>
  </form>
  <div>
    <span>Don't have an account?</span>
    <a routerLink="/register">Register</a>
  </div>
</div>
