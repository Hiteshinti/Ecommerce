<div class="cart">
  <h2>Your Cart</h2>
  <div *ngIf="items.length===0">Cart is empty</div>
  <div *ngFor="let i of items" class="cart-row">
    <div>{{i.name}} x {{i.qty}}</div>
    <div>${{i.price * i.qty | number:'1.2-2'}}</div>
    <button (click)="remove(i.id)">Remove</button>
  </div>
  <div *ngIf="items.length>0" class="cart-footer">
    <div>Subtotal: ${{subtotal() | number:'1.2-2'}}</div>
    <a routerLink="/checkout"><button>Proceed to Checkout</button></a>
    <button (click)="clear()">Clear</button>
  </div>
</div>
