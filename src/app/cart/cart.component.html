<div class="cart">
  <h2>Your Cart</h2>
  <div *ngIf="productItems.length===0">Cart is empty</div>
  <div *ngFor="let i of productItems" class="cart-row">
    <div>{{i.productName}} x {{i.quantityStock}}</div>
    <div>${{i.unitPrice * i.quantityStock | number:'1.2-2'}}</div>
  </div>
  <div *ngIf="productItems.length>0" class="cart-footer">
    <div>Subtotal: ${{subtotal() | number:'1.2-2'}}</div>
    <a routerLink="/checkout"><button>Proceed to Checkout</button></a>
   
  </div>
</div>
